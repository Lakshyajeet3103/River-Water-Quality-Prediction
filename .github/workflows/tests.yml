name: Tests

on:
  push:
    branches: [main, phase-0-repository-scaffolding]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,ml,fusion]"
          python -m pip install -r requirements-dashboard.txt matplotlib requests pyproj shap
      - name: Restore frozen demo artifacts
        run: python scripts/restore_demo_bundle.py
      - name: Run tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint && npm run test && npm run build
        working-directory: frontend
