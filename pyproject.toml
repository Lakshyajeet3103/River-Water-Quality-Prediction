[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "river-water-quality-prediction"
version = "0.1.0"
description = "Multimodal river water quality prediction using satellite and ground monitoring data"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyyaml>=6.0,<7",
    "tzdata>=2022.7",  # IANA timezone database for matching on Windows
]

[project.optional-dependencies]
earthengine = [
    "earthengine-api>=1.5,<2",
]
ml = [
    "scikit-learn>=1.5,<2",
    "joblib>=1.4,<2",  # Persist fitted baseline artifacts
]
test = [
    "pytest>=8,<9",
]
advanced-demo = [
    "torch>=2.2,<3",
    "matplotlib>=3.8,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
